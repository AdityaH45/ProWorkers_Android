name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Build web app
        env:
          # Set under: Repo -> Settings -> Secrets and variables -> Actions -> Variables
          VITE_API_URL: ${{ vars.API_URL || 'https://proworkers-backend-148c.onrender.com' }}
        run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ProWorkers-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
