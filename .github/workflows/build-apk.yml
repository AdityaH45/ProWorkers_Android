name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Build web app
        env:
          # Set under: Repo -> Settings -> Secrets and variables -> Actions -> Variables
          VITE_API_URL: ${{ vars.API_URL || 'https://proworkers-backend-148c.onrender.com' }}
        run: npm run build
      - run: npx cap sync android
      - name: Prepare the permanent signing key (if it has been set up)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/proworkers.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/proworkers.keystore" >> "$GITHUB_ENV"
            echo "Signing with the permanent ProWorkers key."
          else
            echo "No permanent key yet: signing with the temporary debug key."
          fi
      - name: Build debug APKs (customer/worker app + admin app)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleUserDebug assembleAdminDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ProWorkers-app-for-customers-and-workers
          path: android/app/build/outputs/apk/user/debug/app-user-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProWorkers-ADMIN-app-only-for-admin-phone
          path: android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
