<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1117" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <title>ProWorkers</title>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      body { background:#0D1117; }
      /* Remove the blue flash Leaflet / Android add when you tap the map or its buttons */
      .leaflet-container,
      .leaflet-container *,
      .leaflet-container a { -webkit-tap-highlight-color:transparent !important; }
      .leaflet-container:focus,
      .leaflet-container *:focus { outline:none !important; }
      /* Light pressed feedback so buttons still react to a tap */
      button:active { opacity:0.85; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
